<body class="bg-background text-on-surface h-[800px] w-[1200px] flex flex-col font-body-md overflow-hidden selection:bg-primary-container selection:text-background border border-border-color shadow-2xl relative">
<!-- Window Title Bar -->
<header class="flex justify-between items-center px-md h-12 w-full border-b border-border-color bg-surface-container-low shrink-0 select-none drag-region">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">vpn_key</span>
<span class="font-headline-md text-[14px] font-bold text-primary tracking-tight">KeyVault</span>
</div>
<div class="flex items-center gap-2 no-drag">
<button class="w-8 h-8 flex items-center justify-center rounded-DEFAULT text-outline-variant hover:bg-surface-variant hover:text-on-surface transition-colors" title="Minimize">
<span class="material-symbols-outlined text-[18px]">remove</span>
</button>
<button class="w-8 h-8 flex items-center justify-center rounded-DEFAULT text-outline-variant hover:bg-surface-variant hover:text-on-surface transition-colors" title="Maximize">
<span class="material-symbols-outlined text-[18px]">check_box_outline_blank</span>
</button>
<button class="w-8 h-8 flex items-center justify-center rounded-DEFAULT text-outline-variant hover:bg-error hover:text-background transition-colors" title="Close">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col justify-center items-center overflow-y-auto bg-surface relative">
<!-- Decorative background elements -->
<div class="absolute inset-0 overflow-hidden pointer-events-none flex justify-center items-center opacity-30">
<div class="w-[600px] h-[600px] bg-primary rounded-full blur-[150px] opacity-10 absolute -top-[200px] -left-[200px]"></div>
<div class="w-[500px] h-[500px] bg-tertiary rounded-full blur-[120px] opacity-5 absolute bottom-[0px] right-[0px]"></div>
</div>
<div class="w-full max-w-[480px] flex flex-col gap-lg bg-surface-container rounded-xl border border-border-color p-xl shadow-2xl relative z-10">
<!-- Header Text -->
<div class="text-center mb-md">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-surface-container-high border border-border-color mb-lg shadow-inner">
<span class="material-symbols-outlined text-4xl text-on-surface opacity-80" style="font-variation-settings: 'FILL' 0;">lock_person</span>
</div>
<h1 class="font-headline-lg text-[28px] leading-[36px] font-bold text-on-surface mb-2">保险库已锁定</h1>
<p class="font-body-md text-body-md text-on-surface-variant">输入主密码解锁</p>
</div>
<!-- Password Form -->
<form class="flex flex-col gap-lg" onsubmit="event.preventDefault();">
<!-- Input Group -->
<div class="relative group flex flex-col gap-sm">
<div class="flex items-center bg-surface-container-lowest border border-border-color rounded-DEFAULT px-md py-sm h-14 glow-focus transition-all duration-200">
<span class="material-symbols-outlined text-outline mr-sm shrink-0">key</span>
<input autocomplete="current-password" autofocus="" class="w-full bg-transparent border-none outline-none text-on-surface font-code-md text-[15px] placeholder:text-outline-variant placeholder:font-body-md placeholder:tracking-normal focus:ring-0 p-0" id="master-password" placeholder="主密码" type="password"/>
<button aria-label="Toggle visibility" class="text-outline hover:text-on-surface transition-colors shrink-0 p-1.5 rounded-DEFAULT hover:bg-surface-variant ml-sm flex items-center justify-center" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility</span>
</button>
</div>
<!-- Attempts Warning -->
<div class="flex items-center gap-2 text-error px-xs">
<span class="material-symbols-outlined text-[16px]">warning</span>
<span class="font-body-sm text-body-sm">剩余重试次数: 5</span>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-primary-container text-background font-headline-md text-headline-md rounded-DEFAULT hover:bg-primary-fixed hover:-translate-y-[1px] transition-all duration-200 flex items-center justify-center gap-2 mt-xs shadow-[0_4px_14px_rgba(88,166,255,0.2)]">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">lock_open</span>
                    解锁
                </button>

<div class="mt-md flex flex-col items-center gap-md">
<div class="flex items-center w-full gap-4 opacity-50">
<div class="h-[1px] flex-grow bg-border-color"></div>
<span class="font-body-sm text-[11px] text-outline uppercase tracking-[0.1em] font-bold">或</span>
<div class="h-[1px] flex-grow bg-border-color"></div>
</div>
<button class="w-full flex items-center justify-center gap-3 px-lg h-12 rounded-DEFAULT border border-border-color bg-surface-container-low text-on-surface-variant hover:bg-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">fingerprint</span>

</button>

<div class="mt-lg pt-lg border-t border-border-color flex flex-col gap-md">

<span class="material-symbols-outlined text-[16px]">shield</span>

<button class="text-error/80 hover:text-error transition-colors font-body-sm text-body-sm flex items-center gap-1.5 group bg-error/5 hover:bg-error/10 px-3 py-1.5 rounded-DEFAULT">

            </button>
</div>
</div>

</main>
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('master-password');
            const icon = document.getElementById('visibility-icon');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                pwdInput.classList.add('font-mono'); // Keep mono font when visible
                icon.textContent = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }
    </script>
