<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        body {
            background-color: #0D1117;
            color: #dae3ee;
            overflow: hidden;
        }
        .password-meter-segment {
            height: 4px;
            flex: 1;
            border-radius: 2px;
            background-color: #30363D;
        }
        .password-meter-segment.active-weak {
            background-color: #f85149;
        }
        /* Custom scrollbar to match GitHub aesthetic */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0D1117; }
        ::-webkit-scrollbar-thumb { background: #30363D; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #414752; }
    </style>

<body class="h-screen w-full flex flex-col font-body-md text-body-md">
<!-- TopAppBar -->
<header class="flex justify-between items-center h-10 px-md w-full bg-github-surface border-b border-github-border z-50">
<div class="flex items-center gap-2 font-headline-md text-headline-md font-bold text-on-surface">
<span class="material-symbols-outlined text-primary" style="font-size: 18px;">vpn_key</span>
<span class="font-headline-md text-headline-md">KeyVault</span>
</div>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" style="font-size: 16px;">minimize</span>
</button>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" style="font-size: 16px;">fullscreen</span>
</button>
<button class="text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined" style="font-size: 16px;">close</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex items-center justify-center p-xl relative overflow-hidden">
<!-- Subtle Ambient Glow -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
<!-- Setup Card -->
<div class="w-full max-w-[512px] bg-github-surface border border-github-border rounded-xl shadow-2xl relative z-10 flex flex-col">
<div class="p-xl space-y-lg">
<!-- Header -->
<div class="text-center space-y-sm">
<h1 class="font-headline-lg text-headline-lg text-on-surface">欢迎使用 KeyVault</h1>
<p class="text-on-surface-variant font-body-md text-body-md">设置您的主密码</p>
</div>
<!-- Warning Banner -->
<div class="bg-tertiary/10 border border-tertiary/30 p-md rounded-lg flex gap-3 items-start">
<span class="material-symbols-outlined text-tertiary" style="font-size: 20px;">warning</span>
<p class="text-tertiary font-body-sm text-body-sm leading-tight">
                        主密码无法找回，务必牢记。它是加密您所有数据的唯一凭证。
                    </p>
</div>
<!-- Password Field Group -->
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase tracking-wider" for="master-password">设置主密码</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border border-github-border px-md py-3 font-code-md text-code-md rounded focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all text-on-surface placeholder:text-outline-variant" id="master-password" placeholder="输入高强度密码" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibility-icon" style="font-size: 20px;">visibility</span>
</button>
</div>
<!-- Password Strength Meter -->
<div class="pt-base space-y-xs">
<div class="flex gap-1.5 w-full">
<div class="password-meter-segment active-weak"></div>
<div class="password-meter-segment"></div>
<div class="password-meter-segment"></div>
<div class="password-meter-segment"></div>
</div>
<div class="flex justify-between items-center">
<span class="text-error font-body-sm text-body-sm">强度：极弱</span>
<span class="text-on-surface-variant font-body-sm text-body-sm">建议 12 位以上字符</span>
</div>
</div>
</div>
<!-- Primary Action -->
<div class="pt-sm">
<button class="w-full bg-primary-container hover:bg-primary text-on-primary-container font-headline-md text-headline-md py-3.5 rounded-lg transition-all flex items-center justify-center gap-2 group active:scale-[0.98]">
<span>继续</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" style="font-size: 20px;">arrow_forward</span>
</button>
</div>
</div>
<!-- Card Footer / Progress -->
<footer class="border-t border-github-border bg-surface-container-low px-xl py-md flex justify-between items-center rounded-b-xl">
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-[0.1em]">第 1 步 / 共 2 步</span>
<div class="flex gap-2">
<div class="w-2 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-github-border"></div>
</div>
</footer>
</div>
<!-- Background Security Elements (Purely Aesthetic) -->
<div class="absolute bottom-10 right-10 flex flex-col gap-2 opacity-20 select-none pointer-events-none">
<div class="font-code-md text-code-md text-primary flex gap-4">
<span>AES-256-GCM</span>
<span>PBKDF2-SHA512</span>
</div>
<div class="font-code-md text-code-md text-outline">LOCAL_STORAGE_MODE: ENCRYPTED</div>
</div>
</main>
<script>
        function togglePassword() {
            const input = document.getElementById('master-password');
            const icon = document.getElementById('visibility-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Add a micro-interaction for the password field focus
        const passwordInput = document.getElementById('master-password');
        passwordInput.addEventListener('input', (e) => {
            const segments = document.querySelectorAll('.password-meter-segment');
            const statusText = document.querySelector('.text-error');
            const length = e.target.value.length;
            
            // Simple visual logic for demonstration
            if (length > 0 && length < 6) {
                segments[0].className = 'password-meter-segment active-weak';
                segments[1].className = 'password-meter-segment';
                statusText.textContent = '强度：极弱';
                statusText.className = 'text-error font-body-sm text-body-sm';
            } else if (length >= 6 && length < 10) {
                segments[0].className = 'password-meter-segment bg-tertiary';
                segments[1].className = 'password-meter-segment bg-tertiary';
                segments[2].className = 'password-meter-segment';
                statusText.textContent = '强度：一般';
                statusText.className = 'text-tertiary font-body-sm text-body-sm';
            } else if (length >= 10) {
                segments[0].className = 'password-meter-segment bg-secondary';
                segments[1].className = 'password-meter-segment bg-secondary';
                segments[2].className = 'password-meter-segment bg-secondary';
                segments[3].className = 'password-meter-segment bg-secondary';
                statusText.textContent = '强度：强';
                statusText.className = 'text-secondary font-body-sm text-body-sm';
            } else {
                segments[0].className = 'password-meter-segment active-weak';
                segments[1].className = 'password-meter-segment';
                segments[2].className = 'password-meter-segment';
                segments[3].className = 'password-meter-segment';
                statusText.textContent = '强度：极弱';
            }
        });
    </script>
</body></html>
