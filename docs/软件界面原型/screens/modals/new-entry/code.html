<!DOCTYPE html>
<!-- CANONICAL: 新建网站密码模态。见 UNIFIED-SPEC.md §2.5 变体 F / PROTOTYPE-PROMPTS P1-2 -->
<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>KeyVault - 新建条目</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
        @layer utilities {
            .bg-level-0 { background-color: #0D1117; }
            .bg-level-1 { background-color: #161B22; }
            .bg-level-2 { background-color: #1C2128; }
            .border-hairline { border-color: #30363D; }
            .text-accent { color: #58A6FF; }
            .bg-accent { background-color: #58A6FF; }
            .text-secondary { color: #C9D1D9; }
            .focus-glow:focus {
                border-color: #58A6FF;
                box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
            }
            .blur-backdrop { backdrop-filter: blur(8px); }
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#58a6ff",
                        "on-primary": "#0D1117",
                        "surface": "#0D1117",
                        "surface-container": "#161B22",
                        "surface-container-high": "#1C2128",
                        "on-surface": "#dae3ee",
                        "on-surface-variant": "#C9D1D9",
                        "outline": "#30363D",
                        "success": "#3FB950",
                        "warning": "#d29922",
                        "error": "#f85149"
                    },
                    fontFamily: {
                        "headline-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "code-md": ["JetBrains Mono"],
                        "body-md": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    fontSize: {
                        "headline-md": ["18px", { lineHeight: "24px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }],
                        "headline-lg": ["24px", { lineHeight: "32px", letterSpacing: "-0.02em", fontWeight: "600" }],
                        "code-md": ["13px", { lineHeight: "20px", fontWeight: "400" }],
                        "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "label-caps": ["11px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "700" }]
                    },
                    spacing: {
                        "sidebar-width": "260px",
                        "lg": "24px",
                        "xs": "4px",
                        "xl": "40px",
                        "md": "16px",
                        "detail-panel-width": "400px",
                        "sm": "8px",
                        "base": "4px"
                    },
                    borderRadius: {
                        "DEFAULT": "4px",
                        "md": "6px",
                        "lg": "8px"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface h-screen w-full overflow-hidden flex flex-col font-body-md relative selection:bg-primary/30 selection:text-primary">
<!-- TopBar (Window Chrome) -->
<header class="h-[40px] bg-surface flex justify-between items-center px-4 w-full border-b border-outline shrink-0 select-none z-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[18px]">vpn_key</span>
<span class="font-headline-md text-headline-md text-primary">KeyVault</span>
</div>
<div class="flex items-center gap-4 text-on-surface-variant">
<span class="material-symbols-outlined hover:text-on-surface cursor-pointer text-[16px]">remove</span>
<span class="material-symbols-outlined hover:text-on-surface cursor-pointer text-[16px]">fullscreen</span>
<span class="material-symbols-outlined hover:text-error cursor-pointer text-[16px]">close</span>
</div>
</header>
<!-- Simulated Main Background (Blurred) -->
<div class="absolute inset-0 top-[40px] flex z-0 opacity-40 select-none pointer-events-none">
<!-- Sidebar -->
<div class="w-sidebar-width bg-surface-container border-r border-outline flex flex-col p-md gap-4">
<div class="h-8 bg-surface-container-high rounded w-3/4"></div>
<div class="flex flex-col gap-2">
<div class="h-6 bg-surface-container-high rounded w-full"></div>
<div class="h-6 bg-surface-container-high rounded w-5/6"></div>
<div class="h-6 bg-surface-container-high rounded w-4/5"></div>
</div>
</div>
<!-- List -->
<div class="flex-1 border-r border-outline p-lg flex flex-col gap-3">
<div class="h-10 bg-surface-container rounded-lg w-full mb-4 border border-outline"></div>
<div class="h-12 bg-surface-container border-b border-outline w-full"></div>
<div class="h-12 bg-surface-container border-b border-outline w-full"></div>
<div class="h-12 bg-surface-container border-b border-outline w-full"></div>
</div>
<!-- Detail Panel -->
<div class="w-detail-panel-width bg-surface-container p-lg flex flex-col gap-4">
<div class="h-12 bg-surface-container-high rounded w-2/3 mb-6"></div>
<div class="h-10 bg-surface border border-outline rounded w-full"></div>
<div class="h-10 bg-surface border border-outline rounded w-full"></div>
</div>
</div>
<!-- Modal Backdrop & Container -->
<div class="absolute inset-0 top-[40px] bg-surface/60 blur-backdrop flex items-center justify-center z-20">
<!-- Modal Form -->
<div class="bg-surface-container border border-outline rounded-lg w-full max-w-[560px] max-h-[921px] flex flex-col shadow-2xl relative overflow-hidden ring-1 ring-white/5">
<!-- Modal Header -->
<div class="px-lg py-md border-b border-outline flex justify-between items-center bg-surface-container shrink-0">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded bg-surface-container-high border border-outline flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[18px]">login</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">新建网站密码</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">添加新的登录凭据</p>
</div>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Modal Content (Scrollable) -->
<div class="p-lg overflow-y-auto flex flex-col gap-6 custom-scrollbar">
<!-- Section: Login Credentials -->
<div class="flex flex-col gap-4">
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">登录凭据</h3>
<div class="flex flex-col gap-3">
<!-- Title Field -->
<div class="flex flex-col gap-1.5">
<label class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-1">
                                标题 <span class="text-error">*</span>
</label>
<input class="w-full bg-surface border border-outline rounded px-3 py-2 text-on-surface font-body-md placeholder-on-surface-variant focus:outline-none focus-glow transition-all" placeholder="例如：GitHub" type="text"/>
</div>
<!-- URL Field -->
<div class="flex flex-col gap-1.5">
<label class="font-body-sm text-body-sm text-on-surface-variant">网址</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[16px]">link</span>
<input class="w-full bg-surface border border-outline rounded pl-9 pr-3 py-2 text-on-surface font-body-md placeholder-on-surface-variant focus:outline-none focus-glow transition-all" placeholder="https://" type="url"/>
</div>
</div>
<!-- 用户名 Field -->
<div class="flex flex-col gap-1.5">
<label class="font-body-sm text-body-sm text-on-surface-variant">用户名 / 邮箱</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[16px]">person</span>
<input class="w-full bg-surface border border-outline rounded pl-9 pr-3 py-2 text-on-surface font-body-md placeholder-on-surface-variant focus:outline-none focus-glow transition-all" placeholder="user@example.com" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5 relative group">
<div class="flex justify-between items-end">
<label class="font-body-sm text-body-sm text-on-surface-variant">密码</label>
<button class="font-body-sm text-body-sm text-primary hover:underline flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">refresh</span>
                                    生成密码
                                </button>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[16px]">key</span>
<input class="w-full bg-surface border border-outline rounded pl-9 pr-10 py-2 text-on-surface font-code-md text-code-md tracking-wider focus:outline-none focus-glow transition-all" type="password" value="xk9#mP2$vLq8"/>
<button class="absolute right-3 text-on-surface-variant hover:text-on-surface transition-colors" title="显示密码">
<span class="material-symbols-outlined text-[16px]">visibility</span>
</button>
</div>
<!-- Strength Meter -->
<div class="flex gap-1 mt-1 h-1 w-full">
<div class="h-full bg-success flex-1 rounded-l-full"></div>
<div class="h-full bg-success flex-1"></div>
<div class="h-full bg-success flex-1"></div>
<div class="h-full bg-surface border border-outline flex-1 rounded-r-full"></div>
</div>
<p class="font-body-sm text-body-sm text-success text-right mt-1">良好 (12个字符)</p>
</div>
</div>
</div>
<div class="h-px bg-outline w-full"></div>
<!-- Section: Additional Info -->
<div class="flex flex-col gap-4">
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">附加信息</h3>
<!-- Tags -->
<div class="flex flex-col gap-1.5">
<label class="font-body-sm text-body-sm text-on-surface-variant">标签</label>
<div class="min-h-[36px] bg-surface border border-outline rounded p-1 flex flex-wrap gap-1 items-center focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 transition-all">
<div class="bg-surface-container-high border border-outline rounded-full px-2 py-0.5 flex items-center gap-1">
<span class="font-body-sm text-body-sm text-on-surface">工作</span>
<span class="material-symbols-outlined text-[12px] text-on-surface-variant hover:text-error cursor-pointer">close</span>
</div>
<input class="bg-transparent border-none outline-none text-on-surface font-body-sm min-w-[80px] flex-1 px-1 h-6 placeholder-on-surface-variant" placeholder="添加标签..." type="text"/>
</div>
</div>
<!-- Secure Note -->
<div class="flex flex-col gap-1.5">
<label class="font-body-sm text-body-sm text-on-surface-variant">安全笔记</label>
<textarea class="w-full bg-surface border border-outline rounded px-3 py-2 text-on-surface font-body-md placeholder-on-surface-variant focus:outline-none focus-glow transition-all resize-none" placeholder="添加相关备注..." rows="3"></textarea>
</div>
</div>
<!-- Custom Fields -->
<div class="flex flex-col gap-3">
<button class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors py-2 border border-dashed border-outline rounded justify-center hover:border-primary/50 hover:bg-primary/5 group">
<span class="material-symbols-outlined text-[18px]">add</span>
<span class="font-body-md text-body-md">添加自定义字段</span>
</button>
</div>
</div>
<!-- Modal Footer -->
<div class="px-lg py-md border-t border-outline bg-surface-container flex justify-end gap-3 shrink-0">
<button class="px-4 py-2 rounded text-on-surface-variant font-body-md hover:text-on-surface transition-colors border border-transparent hover:border-outline hover:bg-surface-container-high">
                    取消
                </button>
<button class="px-4 py-2 rounded bg-primary text-on-primary font-body-md font-semibold hover:bg-primary/90 transition-colors shadow-sm">
                    保存条目
                </button>
</div>
</div>
</div>
<style>
        /* Custom scrollbar for modal content to maintain clean aesthetic */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #30363D;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {

        }
    </style>
