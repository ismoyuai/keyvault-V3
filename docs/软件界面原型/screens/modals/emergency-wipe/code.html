<div class="flex flex-col gap-xs">

<button aria-label="Toggle password visibility" class="absolute right-sm text-outline-variant hover:text-on-surface transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
</div>

<script>
        // Simple script to handle password visibility toggle purely for visual feedback
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('button[aria-label="Toggle password visibility"]');
            const passwordInput = document.getElementById('master-password');
            
            if(toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const iconSpan = toggleBtn.querySelector('.material-symbols-outlined');
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        iconSpan.textContent = 'visibility_off';
                    } else {
                        passwordInput.type = 'password';
                        iconSpan.textContent = 'visibility';
                    }
                });
            }
        });
    </script>
