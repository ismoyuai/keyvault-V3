<body class="bg-background text-on-background h-screen w-screen flex flex-col overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background text-primary dark:text-primary docked full-width top-0 h-10 border-b border-outline-variant flat no shadows transition-colors duration-200 flex justify-between items-center px-4 w-full select-none" style="-webkit-app-region: drag;">

</div>
<!-- Window Controls -->
<div class="flex items-center space-x-0" style="-webkit-app-region: no-drag;">
<button class="h-10 w-10 flex items-center justify-center hover:bg-surface-variant transition-colors text-on-surface-variant hover:text-on-surface">

<button class="h-10 w-10 flex items-center justify-center hover:bg-surface-variant transition-colors text-on-surface-variant hover:text-on-surface">
<span class="material-symbols-outlined text-[16px]">fullscreen</span>

<!-- Main Content Area -->

<div class="w-full max-w-lg bg-surface-container-low border border-outline-variant rounded-xl shadow-[0_8px_32px_rgba(0,0,0,0.4)] relative z-10 flex flex-col p-xl">
<!-- Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-surface-container-highest border border-outline-variant mb-4">
<span class="material-symbols-outlined text-primary text-[24px]">vpn_key</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">欢迎使用 KeyVault</h1>
<h2 class="font-headline-md text-headline-md text-on-surface-variant">设置您的主密码</h2>
</div>
<!-- Explanatory Text -->
<div class="bg-surface-container p-md rounded-lg border border-outline-variant mb-lg flex gap-3 items-start">
<span class="material-symbols-outlined text-tertiary text-[20px] shrink-0 mt-0.5">warning</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    主密码是保护您所有数据的唯一钥匙，请务必牢记。我们无法为您重置或找回主密码。
                </p>
</div>
<!-- Form -->
<form class="space-y-lg">
<!-- Master Password -->
<div class="space-y-sm relative">
<label class="block font-label-caps text-label-caps text-on-surface" for="master-password">设置主密码</label>
<div class="relative group">
<input class="w-full bg-surface-container-highest border border-outline-variant rounded px-md py-2.5 font-code-md text-code-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="master-password" placeholder="••••••••••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[18px]">visibility_off</span>
</button>
</div>
<!-- Strength Meter -->
<div class="pt-sm space-y-1">
<div class="flex gap-1 h-1.5 w-full">
<div class="flex-1 bg-surface-variant rounded-l"></div>
<div class="flex-1 bg-surface-variant"></div>
<div class="flex-1 bg-surface-variant"></div>
<div class="flex-1 bg-surface-variant rounded-r"></div>
</div>
<div class="flex justify-between items-center px-1">
<span class="font-label-caps text-[10px] text-on-surface-variant tracking-widest">强度</span>
<span class="font-label-caps text-[10px] text-on-surface-variant">--</span>
</div>
</div>
</div>

<span class="font-label-caps text-[10px] text-outline-variant tracking-widest">STEP 1 OF 2</span>
</div>

</main>
<script>
        // Simple micro-interaction for password visibility
        document.querySelectorAll('button[type="button"]').forEach(btn => {
            const icon = btn.querySelector('.material-symbols-outlined');
            if(icon && (icon.textContent === 'visibility_off' || icon.textContent === 'visibility')) {
                btn.addEventListener('click', (e) => {
                    const input = e.currentTarget.previousElementSibling;
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.textContent = 'visibility';
                    } else {
                        input.type = 'password';
                        icon.textContent = 'visibility_off';
                    }
                });
            }
        });

        // Basic strength meter logic for UI demonstration
        const masterInput = document.getElementById('master-password');
        const segments = masterInput.parentElement.nextElementSibling.querySelectorAll('.flex-1');
        const statusText = masterInput.parentElement.nextElementSibling.querySelector('span:last-child');

        masterInput.addEventListener('input', (e) => {
            const val = e.target.value;
            segments.forEach(s => { s.className = 'flex-1 bg-surface-variant'; s.classList.remove('rounded-l', 'rounded-r'); });
            segments[0].classList.add('rounded-l');
            segments[3].classList.add('rounded-r');
            
            if (val.length === 0) {
                statusText.textContent = '--';
                statusText.className = 'font-label-caps text-[10px] text-on-surface-variant';
            } else if (val.length < 6) {
                segments[0].classList.replace('bg-surface-variant', 'bg-error');
                statusText.textContent = 'WEAK';
                statusText.className = 'font-label-caps text-[10px] text-error';
            } else if (val.length < 10) {
                segments[0].classList.replace('bg-surface-variant', 'bg-tertiary-container');
                segments[1].classList.replace('bg-surface-variant', 'bg-tertiary-container');
                statusText.textContent = 'FAIR';
                statusText.className = 'font-label-caps text-[10px] text-tertiary-container';
            } else if (val.length < 14) {
                segments[0].classList.replace('bg-surface-variant', 'bg-tertiary');
                segments[1].classList.replace('bg-surface-variant', 'bg-tertiary');
                segments[2].classList.replace('bg-surface-variant', 'bg-tertiary');
                statusText.textContent = 'GOOD';
                statusText.className = 'font-label-caps text-[10px] text-tertiary';
            } else {
                segments[0].classList.replace('bg-surface-variant', 'bg-[#3FB950]');
                segments[1].classList.replace('bg-surface-variant', 'bg-[#3FB950]');
                segments[2].classList.replace('bg-surface-variant', 'bg-[#3FB950]');
                segments[3].classList.replace('bg-surface-variant', 'bg-[#3FB950]');
                statusText.textContent = 'STRONG';
                statusText.className = 'font-label-caps text-[10px] text-[#3FB950]';
            }
        });
    </script>
