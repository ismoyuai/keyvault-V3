<body class="flex flex-col h-screen overflow-hidden selection:bg-primary-container selection:text-on-primary-container">

<div class="flex flex-col gap-2 relative">
<label class="font-body-sm text-body-sm text-on-surface-variant">确认主密码</label>
<div class="relative flex items-center w-full">
<input class="input-secure w-full h-[40px] px-sm rounded font-code-md text-code-md border-[#F85149] focus:ring-0 focus:border-[#F85149] shadow-[0_0_0_2px_rgba(248,81,73,0.2)]" type="password" value="********"/>
<button class="absolute right-3 text-on-surface-variant hover:text-on-surface focus:outline-none flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[18px]">visibility_off</span>
</button>
</div>

                    </button>
<button class="btn-primary h-[36px] px-md rounded font-body-md text-body-md font-semibold transition-colors cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary-container disabled:opacity-50 disabled:cursor-not-allowed" type="button">

<script>
        // Simple visibility toggle
        const toggleBtn = document.querySelector('button[type="button"]');
        const inputField = document.querySelector('input[type="password"]');
        
        if (toggleBtn && inputField) {
            toggleBtn.addEventListener('click', () => {
                const icon = toggleBtn.querySelector('.material-symbols-outlined');
                if (inputField.type === 'password') {
                    inputField.type = 'text';
                    icon.textContent = 'visibility';
                } else {
                    inputField.type = 'password';
                    icon.textContent = 'visibility_off';
                }
            });
        }
    </script>
