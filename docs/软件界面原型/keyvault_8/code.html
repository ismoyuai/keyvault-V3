<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        
        .glow-focus:focus-within {
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.3);
            border-color: #58a6ff;
        }

        /* Monospace font for password input */
        input[type="password"], input[type="text"].font-mono {
            font-family: 'JetBrains Mono', monospace;

<body class="bg-background text-on-surface h-screen flex flex-col font-body-md overflow-hidden selection:bg-primary-container selection:text-background">
<!-- Transactional Screen: Navigation shells suppressed per rules -->
<!-- Top Bar (Brand Anchor) -->
<header class="flex justify-between items-center px-md py-sm w-full border-b border-border-color bg-background shrink-0">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">vpn_key</span>
<span class="font-headline-md text-headline-md font-bold text-primary tracking-tight">KeyVault</span>
</div>
<div>
<!-- Empty trailing for clean transactional view -->
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col justify-center items-center px-lg py-xl overflow-y-auto">
<div class="w-full max-w-[400px] flex flex-col gap-lg">
<!-- Header Text -->
<div class="text-center mb-sm">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-surface-container-high border border-border-color mb-md">
<span class="material-symbols-outlined text-3xl text-on-surface" style="font-variation-settings: 'FILL' 0;">lock_person</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">保险库已锁定</h1>
<p class="font-body-md text-body-md text-on-surface-variant">输入主密码解锁</p>
</div>
<!-- Password Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Input Group -->
<div class="relative group">
<div class="flex items-center bg-surface-container-low border border-border-color rounded-DEFAULT px-md py-sm h-12 glow-focus transition-all duration-200">
<span class="material-symbols-outlined text-outline mr-sm shrink-0">key</span>
<input autocomplete="current-password" autofocus="" class="w-full bg-transparent border-none outline-none text-on-surface font-code-md text-code-md placeholder:text-outline-variant placeholder:font-body-md placeholder:tracking-normal focus:ring-0 p-0" id="master-password" placeholder="主密码" type="password"/>
<button aria-label="Toggle visibility" class="text-outline hover:text-on-surface transition-colors shrink-0 p-1 rounded-DEFAULT hover:bg-surface-variant ml-sm flex items-center justify-center" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Attempts Warning -->
<div class="flex items-center gap-2 text-error px-xs">
<span class="material-symbols-outlined text-[16px]">warning</span>
<span class="font-body-sm text-body-sm">剩余重试次数: 5</span>
</div>
<!-- Primary Action -->
<button class="w-full h-12 bg-primary-container text-background font-headline-md text-headline-md rounded-DEFAULT hover:bg-primary-fixed transition-colors flex items-center justify-center gap-2 mt-sm shadow-[0_0_15px_rgba(88,166,255,0.15)]" type="submit">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">lock_open</span>
                    解锁
                </button>
<!-- Biometric Alternative -->
<div class="mt-md flex flex-col items-center gap-sm">
<div class="flex items-center w-full gap-4 opacity-50">
<div class="h-[1px] flex-grow bg-border-color"></div>
<span class="font-body-sm text-body-sm text-outline uppercase tracking-wider">或</span>
<div class="h-[1px] flex-grow bg-border-color"></div>
</div>
<button class="flex items-center gap-2 px-lg py-sm rounded-DEFAULT border border-border-color bg-transparent text-on-surface-variant hover:bg-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">fingerprint</span>
<span class="font-body-md text-body-md">生物识别解锁</span>
</button>
</div>
</form>
</div>
</main>
<!-- Footer Links -->
<footer class="mt-auto px-lg py-xl w-full flex flex-col items-center gap-md shrink-0 border-t border-border-color bg-surface-container-lowest">
<!-- Encryption Notice -->
<div class="flex items-center gap-2 text-outline-variant opacity-80 mb-sm">
<span class="material-symbols-outlined text-[14px]">shield</span>
<span class="font-body-sm text-body-sm text-center">本地 AES-256 加密 · 零知识架构</span>
</div>
<div class="flex flex-col sm:flex-row gap-4 items-center w-full justify-center">
<a class="text-on-surface-variant hover:text-primary transition-colors font-body-sm text-body-sm underline decoration-outline-variant underline-offset-4" href="#">忘记主密码？</a>
<span class="hidden sm:inline text-outline-variant">•</span>
<button class="text-error hover:text-error-container transition-colors font-body-sm text-body-sm flex items-center gap-1 group">
<span class="material-symbols-outlined text-[16px] group-hover:animate-pulse">delete_forever</span>
                紧急擦除
            </button>
</div>
</footer>
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('master-password');
            const icon = document.getElementById('visibility-icon');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                pwdInput.classList.add('font-mono'); // Keep mono font when visible
                icon.textContent = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }
    </script>
