<script>
        function toggleFinishButton() {
            const checkbox = document.getElementById('confirm-backup');
            const btn = document.getElementById('finish-btn');
            if (checkbox.checked) {
                btn.disabled = false;
                btn.className = "px-lg py-sm rounded font-body-md text-body-md bg-[#58A6FF] text-[#0D1117] hover:bg-primary-fixed transition-all duration-300 cursor-pointer font-semibold shadow-[0_0_10px_rgba(88,166,255,0.3)]";
            } else {
                btn.disabled = true;
                btn.className = "px-lg py-sm rounded font-body-md text-body-md bg-surface-variant text-on-surface-variant cursor-not-allowed transition-all duration-300";
            }
        }

        function copyKey() {
            const keyText = document.getElementById('recovery-key').innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                // Visual feedback could go here, keeping it simple for now
                alert('已复制到剪贴板');
