        /* Checkbox styling */
        .kv-checkbox {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid #30363D;
            border-radius: 3px;
            background-color: transparent;
            display: inline-grid;
            place-content: center;
            cursor: pointer;
        }
        .kv-checkbox::before {
            content: "";
            width: 10px;
            height: 10px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #58A6FF;
            background-color: #58A6FF;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .kv-checkbox:checked { border-color: #58A6FF; }
        .kv-checkbox:checked::before { transform: scale(1); }
        
        /* Danger button specific override for pure #F85149 */

<button class="px-md py-sm rounded hairline-border font-body-md text-body-md transition-colors btn-danger opacity-50 cursor-not-allowed" disabled="" id="deleteBtn" type="button">

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkbox = document.getElementById('confirmDeleteCheck');
            const deleteBtn = document.getElementById('deleteBtn');
            
            checkbox.addEventListener('change', (e) => {
                if(e.target.checked) {
                    deleteBtn.disabled = false;
                    deleteBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                } else {
                    deleteBtn.disabled = true;
                    deleteBtn.classList.add('opacity-50', 'cursor-not-allowed');
                }
            });
        });
    </script>
